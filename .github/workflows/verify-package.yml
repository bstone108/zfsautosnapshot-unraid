name: Verify Package

on:
  pull_request:
  push:
    paths-ignore:
      - 'dist/**'
      - 'zfs.autosnapshot.plg'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Install harness tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y php-cli shellcheck shfmt libxml2-utils jq xz-utils

      - name: Run test harness
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/run_harness.py --strict-clean

      - name: Build verification package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="ci-${GITHUB_SHA::12}"
          BASE_URL="https://example.invalid/${GITHUB_REF_NAME}/dist"
          ./scripts/build-release.sh "$VERSION" "$BASE_URL"
